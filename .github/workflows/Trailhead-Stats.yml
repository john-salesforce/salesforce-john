name: Update Trailhead Stats

on:
  schedule:
    - cron: '0 */8 * * *' # Every 8 hours
  workflow_dispatch: # Manual run (useful after a repo rename)

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: nabondance/Trailhead-Stats@v2.0.0
        with:
          # Trailblazer slug: https://www.salesforce.com/trailblazer/john-salesforce
          # Independent of this GitHub repository name.
          trailhead-username: 'john-salesforce'
          display-type: 'card'
          display-file: 'README.md'
          show-skill: 'hidden'
          show-certification: 'detail'
          show-superbadge: 'number'
          show-event-badge: 'number'
          show-stamp: 'number'
          show-badge-latest: 'visible'
